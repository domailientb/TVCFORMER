# dataset
root_path: 'datasets/Customs'
data_path: 'electricity.csv'
scale: True
traget: 'OT'

# model
model: 'TVCFormer'
e_layers: 3
d_layers: 1
enc_in: 321
patch_len: 12
stride: 6
time_node_num: 7
gnn_r_degree: 1
affine: False

# train
itr: 1
batch_size: 16
patience: 5
train_epochs: 100
checkpoints: "checkpoints/Customs/electricity"

# adjust
d_model: 64
n_heads: 16
d_ff: 256
learning_rate: 0.0005
dropout: 0.2
gnn_hidden_size: 32
graph_conv_hidden_size: 4
graph_conv_kernel_size: 5
subgraph_keep_rate: 0.01
