# ATVF configuration - Exchange_rate
# Put the standard Exchange_rate.csv file in datasets/Customs/.
root_path: 'datasets/Customs'
data_path: 'exchange_rate.csv'
scale: True
target: 'OT'
model: 'ATVF'
e_layers: 2
d_layers: 1
enc_in: 8
patch_len: 12
stride: 6
time_node_num: 7
gnn_r_degree: 1
affine: False
itr: 1
batch_size: 32
patience: 5
train_epochs: 30
checkpoints: "checkpoints/ATVF/ExchangeRate"
lradj: "type3"
pct_start: 0.3
d_model: 32
n_heads: 8
d_ff: 128
learning_rate: 0.001
dropout: 0.2
head_dropout: 0.0
gnn_hidden_size: 32
graph_conv_hidden_size: 4
graph_conv_kernel_size: 3
subgraph_keep_rate: 0.7
atvf_hidden_dim: 16
edge_keep_rate: 0.35
lambda_stability: 0.01
lambda_sparsity: 0.001
lambda_smooth: 0.001
