# dataset
root_path: 'datasets/Ett_Series'
data_path: 'ETTh2.csv'
scale: True
traget: 'OT'

# model
model: 'TVCFormer'
e_layers: 2
d_layers: 1
enc_in: 7
patch_len: 12
stride: 6
time_node_num: 7
gnn_r_degree: 1
affine: False

# train
itr: 1
batch_size: 128
patience: 10
train_epochs: 100
checkpoints: "checkpoints/Ett_series/ETTh2"
lradj: "type3"
pct_start: 0.3

# adjust
d_model: 32
n_heads: 8
d_ff: 128
learning_rate: 0.0001
dropout: 0.5
head_dropout: 0.0
gnn_hidden_size: 32
graph_conv_hidden_size: 4
graph_conv_kernel_size: 5
subgraph_keep_rate: 0.3