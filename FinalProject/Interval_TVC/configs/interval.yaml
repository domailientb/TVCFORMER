datasets:
  ETTh1:
    data: ETTh1
    dataset_loader: ETTh
    root_path: experiments/datasets/ETT-small
    data_path: ETTh1.csv
    target: OT
    scale: true
    seq_len: 336
    label_len: 0
    enc_in: 7
    d_model: 32
    n_heads: 8
    e_layers: 2
    d_ff: 128
    dropout: 0.5
    fc_dropout: 0.05
    head_dropout: 0.0
    patch_len: 12
    stride: 6
    padding_patch: start
    time_node_num: 7
    gnn_r_degree: 1
    gnn_hidden_size: 32
    graph_conv_hidden_size: 4
    graph_conv_kernel_size: 3
    subgraph_keep_rate: 0.7
    graph_keep_self_cycles: false
    eps: 0.00001
    revins: true
    affine: false
    subtract_last: false
    individual: false
    decomposition: false
    decomposition_kernel_size: 25
    sdei: 0
    graph_gate: 0
    a_ge: 0
    last_value_residual: 0
    na_head: 0
    learning_rate: 0.001
    patience: 10
    train_epochs: 100
    lradj: type3
    weight_decay: 0.0
    batch_size: 32
    num_workers: 0
    nominal_coverage: 0.95
    monitor_fraction: 0.4
    min_calibration_windows: 100
    primary_calibration_method: horizon_channel
    checkpoint_dir: FinalProject/Interval_TVC/checkpoints/full_3seeds_v1
    result_dir: FinalProject/Interval_TVC/results/full_3seeds_v1

